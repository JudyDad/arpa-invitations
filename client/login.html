<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ARPA · تسجيل الدخول</title><link rel="stylesheet" href="/login.css"><script defer src="/login.js"></script></head>
<body><main class="login-shell">
  <section class="brand-panel" aria-label="ARPA Choir and Orchestra"><img class="cover" src="/assets/arpa-cover.jpg" alt="كورال وأوركسترا آربا في الحفل وقائد الأوركسترا" width="2560" height="948"><div class="brand-caption"><span class="eyebrow" lang="en">ARPA CHOIR &amp; ORCHESTRA</span><h2>الموسيقى تجمعنا</h2><p lang="en" dir="ltr">An invitation to share the music.</p></div><span class="panel-note" lang="en">ALEPPO · EST. 2021</span></section>
  <section class="login-panel" aria-labelledby="login-title">
    <img class="login-logo" src="/assets/arpa-logo.png" width="600" height="500" alt="ARPA Choir &amp; Orchestra">
    <span class="eyebrow" lang="en" dir="ltr">INVITATION STUDIO</span><h1 id="login-title">أهلاً بك في آربا</h1><p class="subtitle">سجّل الدخول لإنشاء دعوات ضيوفك.<span lang="en" dir="ltr">Sign in to create your guest invitations.</span></p>
    <form action="/api/login" method="post">
      <label for="username">اسم المستخدم <span lang="en">Username</span></label><input id="username" name="username" required maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr">
      <label for="password">كلمة المرور <span lang="en">Password</span></label><div class="password-field"><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password" dir="ltr"><button id="toggle-password" class="eye-button" type="button" aria-label="إظهار كلمة المرور · Show password" aria-controls="password" aria-pressed="false"><svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></div>
      <p class="error" role="alert"><!--LOGIN_ERROR--></p><button class="submit" type="submit"><span>تسجيل الدخول</span><span lang="en">Sign in</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg></button>
    </form><p class="private-note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>مساحة خاصة لإدارة الدعوات <span lang="en">Private invitation studio</span></span></p>
  </section>
</main><footer lang="en" dir="ltr">ARPA CHOIR &amp; ORCHESTRA · ALEPPO</footer></body></html>
